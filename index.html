<!DOCTYPE html>
<html>

<head>
  <title>TakeAwayTournament</title> 
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Geist+Pixel&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Marhey:wght@300..700&family=Martian+Mono:wght@100..800&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Tiny5+Duo:ital,wght@0,100..900;1,100..900&family=Xanh+Mono:ital@0;1&display=swap" rel="stylesheet">

<body>
    
<!--WELCOME SCREEN-->
    <section class="screen" id="welcome-screen">
    <h1>Game of Piles</h1>
    <h2>Are you ready?</h2>
    <div class="rules-card">
        <h3>Rules of the game</h3>
        <ul>
            <li>Two players are allowed. Choose total number of piles and rounds to play</li>
            <li>Then each player picks their desired number of piles one by one</li>
            <li>The last one to finish the piles wins the game!</li>
        </ul>
    </div>
    
    <div class="button-container">
        <button>Start Game</button>
    </div>
    </section> 

<!--PLAYER SCREEN-->
    <section class="screen" id="player-screen">
    <h1>Choose Your Players</h1>

    <div class="players-container">
        <div class="player-card">
        <h2>Player 1</h2>
        <input type="text" placeholder="Enter your name">
        </div>

        <div class="player-card">
        <h2>Player 2</h2>
        <input type="text" placeholder="Enter your name">
        </div>
    </div>
    </section>
        
    
</body>
</html>
